<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2230"/>
      <stop offset="1" stop-color="#0a0d13"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.48" r="0.5">
      <stop offset="0" stop-color="#ff3b2f" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#ff3b2f" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ff3b2f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b7c0cc"/>
      <stop offset="0.45" stop-color="#6b7584"/>
      <stop offset="1" stop-color="#2c323c"/>
    </linearGradient>
    <linearGradient id="steelDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6372"/>
      <stop offset="1" stop-color="#262b33"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d23"/>
      <stop offset="0.35" stop-color="#050608"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d27a"/>
      <stop offset="1" stop-color="#b8862b"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-300%" width="300%" height="700%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="visorClip"><rect x="140" y="214" width="232" height="72" rx="30"/></clipPath>
  </defs>

  <!-- sfondo -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="250" r="230" fill="url(#halo)"/>

  <!-- dischi laterali con clessidra -->
  <g>
    <circle cx="122" cy="252" r="30" fill="url(#steelDark)" stroke="#1a1e25" stroke-width="4"/>
    <circle cx="390" cy="252" r="30" fill="url(#steelDark)" stroke="#1a1e25" stroke-width="4"/>
    <path d="M110 236 h24 l-12 16 l12 16 h-24 l12 -16 z" fill="url(#gold)"/>
    <path d="M378 236 h24 l-12 16 l12 16 h-24 l12 -16 z" fill="url(#gold)"/>
  </g>

  <!-- mascella -->
  <path d="M168 318 H344 L326 412 Q256 436 186 412 Z" fill="url(#steelDark)" stroke="#161a20" stroke-width="4"/>
  <g fill="#0d1015">
    <rect x="206" y="340" width="100" height="9" rx="4.5"/>
    <rect x="210" y="358" width="92" height="9" rx="4.5"/>
    <rect x="216" y="376" width="80" height="9" rx="4.5"/>
    <rect x="224" y="394" width="64" height="9" rx="4.5"/>
  </g>

  <!-- casco -->
  <path d="M132 300 V200 Q132 100 256 96 Q380 100 380 200 V300 Q380 326 352 326 H160 Q132 326 132 300 Z"
        fill="url(#steel)" stroke="#161a20" stroke-width="5"/>
  <!-- linea centrale e riflesso -->
  <path d="M256 100 V150" stroke="#2a3038" stroke-width="4" stroke-linecap="round"/>
  <path d="M160 190 Q168 128 236 112" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round"/>

  <!-- stemma: bilancia della giustizia -->
  <g fill="none" stroke="#e2b552" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 150 V196"/>
    <path d="M224 160 H288"/>
    <path d="M224 160 L212 184 M224 160 L236 184"/>
    <path d="M288 160 L276 184 M288 160 L300 184"/>
    <path d="M244 198 H268"/>
  </g>
  <g fill="url(#gold)">
    <path d="M208 184 H240 Q224 200 208 184 Z"/>
    <path d="M272 184 H304 Q288 200 272 184 Z"/>
    <circle cx="256" cy="148" r="6"/>
  </g>

  <!-- visiera -->
  <rect x="140" y="214" width="232" height="72" rx="30" fill="url(#visor)" stroke="#0b0d11" stroke-width="5"/>
  <g clip-path="url(#visorClip)">
    <path d="M150 226 Q256 216 362 226" stroke="#ffffff" stroke-opacity="0.12" stroke-width="5" fill="none"/>
    <!-- occhi -->
    <g filter="url(#glow)">
      <rect x="176" y="242" width="58" height="13" rx="6.5" fill="#ff2a1f"/>
      <rect x="278" y="242" width="58" height="13" rx="6.5" fill="#ff2a1f"/>
    </g>
    <rect x="186" y="245" width="38" height="5" rx="2.5" fill="#ffd0c8"/>
    <rect x="288" y="245" width="38" height="5" rx="2.5" fill="#ffd0c8"/>
    <text x="352" y="278" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="bold"
          fill="#ff2a1f" fill-opacity="0.75" text-anchor="end">T–0</text>
  </g>
</svg>
