name: Build APK

# Compila l'APK di debug a ogni push su main e su richiesta (tab Actions → "Run workflow").
# Con un tag vX.Y.Z (es. `git tag v0.1.0 && git push --tags`) allega l'APK a una GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # necessario solo per creare la Release sui tag

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stessa JDK usata in locale (gradle/gradle-daemon-jvm.properties chiede la 25).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test del motore di calcolo
        run: ./gradlew :core:test

      - name: Compila APK di debug
        run: ./gradlew :app:assembleDebug

      - name: Rinomina APK
        run: |
          VERSION="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          cp app/build/outputs/apk/debug/app-debug.apk "JudgeTermDay-${VERSION}.apk"
          echo "APK=JudgeTermDay-${VERSION}.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: JudgeTermDay-apk
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Release (solo sui tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
          generate_release_notes: true
